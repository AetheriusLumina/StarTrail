name: Windows installer
on: workflow_dispatch
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and verify
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -c requirements/constraints.txt -e ".[translation,build]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/check_public.py --tracked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RADAR_TEST_PYTHON = (Resolve-Path .venv/Scripts/python.exe).Path
          .venv/Scripts/python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/prepare_models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build using runner Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          ./packaging/build.ps1 -IsccPath $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash .build/StarTrail_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  StarTrail_Setup.exe" | Set-Content .build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StarTrail-Windows-x64-preview
          path: |
            .build/StarTrail_Setup.exe
            .build/SHA256SUMS.txt
          if-no-files-found: error
