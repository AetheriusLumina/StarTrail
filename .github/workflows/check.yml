name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional existing ref to verify with the current CI diagnostics
        required: false
        default: ''
        type: string
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -c requirements/constraints.txt -e ".[translation]"
      - name: Public file and regression checks
        shell: pwsh
        run: |
          .venv/Scripts/python scripts/check_public.py --tracked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RADAR_TEST_PYTHON = (Resolve-Path .venv/Scripts/python.exe).Path
          git rev-parse HEAD
          .venv/Scripts/python -u -X faulthandler -c "import faulthandler,unittest,sys; faulthandler.dump_traceback_later(120,repeat=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); faulthandler.cancel_dump_traceback_later(); sys.exit(not result.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
