name: Windows installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish; leave empty for artifact only
        required: false
        default: ''
        type: string
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and verify
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -c requirements/constraints.txt -e ".[translation,build]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/check_public.py --tracked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RADAR_TEST_PYTHON = (Resolve-Path .venv/Scripts/python.exe).Path
          .venv/Scripts/python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/prepare_models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build using runner Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          ./packaging/build.ps1 -IsccPath $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash .build/StarTrail_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  StarTrail_Setup.exe" | Set-Content .build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StarTrail-Windows-x64-preview
          path: |
            .build/StarTrail_Setup.exe
            .build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish requested preview release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'INVALID_RELEASE_TAG' }
          gh release upload $env:RELEASE_TAG .build/StarTrail_Setup.exe .build/SHA256SUMS.txt docs/USER_GUIDE.md --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @($release.assets | Where-Object name -eq 'StarTrail_Setup.exe')
          $expected = (Get-FileHash .build/StarTrail_Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($installer.Count -ne 1 -or $installer[0].digest -ne "sha256:$expected") { throw 'RELEASE_DIGEST_MISMATCH' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
